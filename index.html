<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Note de Frais</title>

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">


  <!-- Framework ATØMIQ v2.0 -->
  <link rel="stylesheet" href="framework/tokens.css">
  <link rel="stylesheet" href="framework/components.css">
  <link rel="stylesheet" href="framework/layout.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: var(--spacing-6) var(--spacing-4);
      background: var(--color-bg-primary);
    }

    .page-header {
      width: 100%;
      max-width: 1040px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--spacing-6);
    }

    /* ── Layout deux colonnes ── */
    .page-body {
      width: 100%;
      max-width: 1040px;
      display: flex;
      gap: var(--spacing-6);
      align-items: flex-start;
    }

    .col-form    { flex: 0 0 480px; }
    .col-preview { flex: 1; min-width: 0; }

    @media (max-width: 820px) {
      .page-body   { flex-direction: column; }
      .col-form    { flex: none; width: 100%; }
      .col-preview { width: 100%; }
    }

    /* ── Upload ── */
    .upload-zone {
      display: block;
      border: 2px dashed var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-8) var(--spacing-4);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      background: var(--color-bg-tertiary);
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: var(--primary-blue);
      background: rgba(0, 68, 204, 0.04);
    }

    .upload-zone input[type="file"] { display: none; }

    .upload-preview {
      display: none;
      align-items: center;
      gap: var(--spacing-3);
      padding: var(--spacing-3) var(--spacing-4);
      background: var(--color-bg-tertiary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      margin-top: var(--spacing-3);
    }

    .upload-preview.show { display: flex; }

    .field-readonly {
      width: 100%;
      padding: var(--spacing-3) var(--spacing-4);
      font-size: var(--text-sm);
      font-family: var(--font-sans);
      color: var(--color-text-muted);
      background: var(--color-bg-tertiary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
    }

    /* ── Aperçu ── */
    .preview-receipt {
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      position: sticky;
      top: var(--spacing-6);
    }

    .preview-receipt-header {
      background: var(--primary-blue);
      color: white;
      padding: var(--spacing-6);
    }

    .preview-receipt-body {
      padding: var(--spacing-6);
    }

    .preview-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: var(--spacing-3) 0;
      border-bottom: 1px solid var(--color-border-light);
      gap: var(--spacing-4);
    }

    .preview-row:last-child { border-bottom: none; }

    .preview-label {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    .preview-value {
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-text-primary);
      text-align: right;
    }

    .preview-value.empty {
      color: var(--color-text-muted);
      font-weight: var(--font-normal);
      font-style: italic;
    }

    .preview-amounts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-3);
      padding: var(--spacing-4);
      background: var(--color-bg-tertiary);
      border-radius: var(--radius-lg);
      margin-top: var(--spacing-4);
    }

    .preview-amount-box {
      text-align: center;
      padding: var(--spacing-3);
      background: var(--color-bg-secondary);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
    }

    .preview-amount-label {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      margin-bottom: var(--spacing-1);
    }

    .preview-amount-value {
      font-size: var(--text-xl);
      font-weight: var(--font-bold);
      color: var(--color-text-primary);
    }

    .preview-amount-value.empty {
      font-size: var(--text-base);
      color: var(--color-text-muted);
      font-weight: var(--font-normal);
    }

    .preview-img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      margin-top: var(--spacing-4);
      display: none;
    }

    .preview-img.show { display: block; }

    .preview-pdf-placeholder {
      display: none;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-3);
      padding: var(--spacing-6);
      background: var(--color-bg-tertiary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      margin-top: var(--spacing-4);
    }

    .preview-pdf-placeholder.show { display: flex; }

    .preview-empty-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-10) var(--spacing-6);
      gap: var(--spacing-3);
      color: var(--color-text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="page-header">
    <div class="flex items-center gap-2">
      <img src="framework/logolight.svg" alt="Logo" id="logo-light" style="height:28px;">
      <img src="framework/logodark.svg" alt="Logo" id="logo-dark" style="height:28px; display:none;">
    </div>
    <button class="btn btn-ghost btn-icon" id="theme-toggle" title="Changer le thème">
      <i class="ti ti-sun" id="theme-icon-sun" style="font-size: 20px;"></i>
      <i class="ti ti-moon" id="theme-icon-moon" style="display:none; font-size: 20px;"></i>
    </button>
  </div>

  <div class="page-body">

    <!-- ══ FORMULAIRE ══ -->
    <div class="col-form">
      <div class="card w-full">
        <div class="card-header">
          <h1 class="card-title">Nouvelle note de frais</h1>
          <p class="card-subtitle">Remplissez le formulaire et joignez votre justificatif</p>
        </div>

        <div class="card-body">
          <form id="ndf-form">

            <!-- Date -->
            <div class="form-group">
              <label class="label" for="ndf-date">
                <i class="ti ti-calendar" style="font-size:15px; vertical-align:-2px;"></i>
                Date
              </label>
              <input type="date" id="ndf-date" name="date" class="input" required>
            </div>

            <!-- Concernant -->
            <div class="form-group">
              <label class="label" for="ndf-concernant">
                <i class="ti ti-info-circle" style="font-size:15px; vertical-align:-2px;"></i>
                Concernant
              </label>
              <input type="text" id="ndf-concernant" name="concernant" class="input" placeholder="Ex : Déjeuner client Dupont, Transport Paris..." required>
            </div>

            <!-- Montants -->
            <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:var(--spacing-3);">
              <div class="form-group">
                <label class="label" for="ndf-ttc">Montant TTC</label>
                <input type="number" id="ndf-ttc" name="montant_ttc" class="input" placeholder="0.00" step="0.01" min="0" required>
              </div>
              <div class="form-group">
                <label class="label" for="ndf-tva">TVA</label>
                <input type="number" id="ndf-tva" name="montant_tva" class="input" placeholder="0.00" step="0.01" min="0">
              </div>
              <div class="form-group">
                <label class="label" for="ndf-ht">Montant HT</label>
                <input type="number" id="ndf-ht" name="montant_ht" class="field-readonly" placeholder="—" readonly tabindex="-1">
              </div>
            </div>

            <!-- Type -->
            <div class="form-group">
              <label class="label" for="ndf-type">
                <i class="ti ti-tag" style="font-size:15px; vertical-align:-2px;"></i>
                Type
              </label>
              <div class="field-readonly">Note de Frais</div>
              <input type="hidden" name="type" value="Note de Frais">
            </div>

            <!-- Upload -->
            <div class="form-group">
              <label class="label">
                <i class="ti ti-paperclip" style="font-size:15px; vertical-align:-2px;"></i>
                Justificatif
              </label>
              <label class="upload-zone" id="upload-zone" for="ndf-file">
                <input type="file" id="ndf-file" name="document" accept="image/*,application/pdf" required>
                <i class="ti ti-cloud-upload text-muted" style="font-size: 32px; display:block; margin-bottom: var(--spacing-2);"></i>
                <span class="text-sm font-medium">Appuyer pour choisir un fichier</span>
                <p class="text-xs text-muted mt-2">Photo ou PDF — max 10 Mo</p>
              </label>
              <div class="upload-preview" id="upload-preview">
                <i class="ti ti-file-check" style="font-size:20px; color: #22c55e; flex-shrink:0;"></i>
                <span class="text-sm truncate" id="upload-filename"></span>
                <button type="button" class="btn btn-ghost btn-icon btn-sm" id="upload-clear" style="margin-left:auto; flex-shrink:0;" title="Supprimer">
                  <i class="ti ti-x" style="font-size:14px;"></i>
                </button>
              </div>
            </div>

            <!-- Feedback -->
            <div id="form-alert" style="display:none;" class="alert mb-4"></div>

            <!-- Submit -->
            <button type="submit" class="btn btn-primary w-full btn-lg" id="submit-btn">
              <i class="ti ti-device-floppy"></i>
              Enregistrer
            </button>

          </form>
        </div>
      </div>
    </div>

    <!-- ══ APERÇU ══ -->
    <div class="col-preview">
      <div class="preview-receipt">

        <div class="preview-receipt-header">
          <div class="flex items-center gap-3 mb-4">
            <i class="ti ti-file-invoice" style="font-size:24px;"></i>
            <div>
              <div style="font-size:var(--text-xs); opacity:.7; text-transform:uppercase; letter-spacing:.05em;">Aperçu</div>
              <div style="font-size:var(--text-lg); font-weight:var(--font-semibold);">Note de Frais</div>
            </div>
          </div>
          <div id="prev-date-header" style="font-size:var(--text-sm); opacity:.8;">—</div>
        </div>

        <!-- État vide -->
        <div class="preview-empty-hint" id="preview-empty">
          <i class="ti ti-eye-off" style="font-size:36px;"></i>
          <span class="text-sm">Remplissez le formulaire<br>pour voir l'aperçu</span>
        </div>

        <!-- Contenu -->
        <div class="preview-receipt-body" id="preview-content" style="display:none;">

          <!-- Aperçu image cliquable -->
          <div style="position:relative;">
            <img id="preview-img" class="preview-img" alt="Aperçu justificatif" style="cursor:zoom-in;">
            <button id="preview-zoom-btn" title="Agrandir"
              style="display:none; position:absolute; top:var(--spacing-2); right:var(--spacing-2);
                     background:rgba(0,0,0,.45); border:none; border-radius:var(--radius-md);
                     color:white; padding:var(--spacing-1) var(--spacing-2); cursor:pointer;">
              <i class="ti ti-arrows-maximize" style="font-size:16px;"></i>
            </button>
          </div>

          <!-- Aperçu HEIC en cours de conversion -->
          <div class="preview-pdf-placeholder" id="preview-converting" style="display:none;">
            <span class="spinner"></span>
            <span class="text-sm text-secondary">Conversion en cours…</span>
          </div>

          <!-- Aperçu PDF embed -->
          <embed id="preview-pdf-embed" type="application/pdf"
            style="display:none; width:100%; height:480px; border-radius:var(--radius-lg); border:1px solid var(--color-border);">

          <!-- Fallback PDF / HEIC -->
          <div class="preview-pdf-placeholder" id="preview-pdf" style="display:none;">
            <i class="ti ti-file-type-pdf" style="font-size:28px; color:var(--primary-red);"></i>
            <span class="text-sm text-secondary" id="preview-pdf-name"></span>
          </div>

        </div>
      </div>
    </div>

  <!-- ══ LIGHTBOX ══ -->
  <div class="modal-overlay" id="lightbox-overlay">
    <div style="position:relative; max-width:90vw; max-height:90vh;">
      <button class="modal-close" id="lightbox-close"
        style="position:absolute; top:-2rem; right:0; color:white;">
        <i class="ti ti-x" style="font-size:22px;"></i>
      </button>
      <img id="lightbox-img" alt="Aperçu agrandi"
        style="max-width:90vw; max-height:88vh; object-fit:contain; border-radius:var(--radius-lg);">
    </div>
  </div>

  </div>

  <script src="framework/theme-toggle.js"></script>
  <script>
    // ── Theme ──────────────────────────────────────────────
    const themeToggle = document.getElementById('theme-toggle');
    const sunIcon     = document.getElementById('theme-icon-sun');
    const moonIcon    = document.getElementById('theme-icon-moon');
    const logoLight   = document.getElementById('logo-light');
    const logoDark    = document.getElementById('logo-dark');

    function syncTheme(isDark) {
      sunIcon.style.display   = isDark ? 'none'  : 'block';
      moonIcon.style.display  = isDark ? 'block' : 'none';
      logoLight.style.display = isDark ? 'none'  : 'block';
      logoDark.style.display  = isDark ? 'block' : 'none';
    }

    function isDarkActive() {
      return document.documentElement.classList.contains('theme-dark') ||
             (!document.documentElement.classList.contains('theme-light') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
    }

    themeToggle.addEventListener('click', () => {
      window.AtomiqTheme.toggle();
      syncTheme(isDarkActive());
    });

    window.addEventListener('theme-changed', () => syncTheme(isDarkActive()));
    syncTheme(isDarkActive());

    // ── Date par défaut = aujourd'hui ──────────────────────
    const dateInput = document.getElementById('ndf-date');
    dateInput.value = new Date().toISOString().split('T')[0];

    // ── Aperçu en temps réel ───────────────────────────────
    const previewEmpty   = document.getElementById('preview-empty');
    const previewContent = document.getElementById('preview-content');

    function formatDate(val) {
      if (!val) return null;
      const [y, m, d] = val.split('-');
      return `${d}/${m}/${y}`;
    }

    function formatAmount(val) {
      if (!val) return null;
      return parseFloat(val).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
    }

    function hasAnyValue() {
      return dateInput.value ||
             document.getElementById('ndf-concernant').value ||
             document.getElementById('ndf-ht').value ||
             document.getElementById('ndf-ttc').value ||
             (fileInput.files && fileInput.files.length);
    }

    function updatePreview() {
      if (hasAnyValue()) {
        previewEmpty.style.display   = 'none';
        previewContent.style.display = 'block';
      } else {
        previewEmpty.style.display   = '';
        previewContent.style.display = 'none';
      }
      const dateFormatted = formatDate(dateInput.value);
      document.getElementById('prev-date-header').textContent = dateFormatted || '—';
    }

    dateInput.addEventListener('input', updatePreview);
    document.getElementById('ndf-concernant').addEventListener('input', updatePreview);

    // ── Calcul automatique HT / TVA / TTC ─────────────────
    const htInput  = document.getElementById('ndf-ht');
    const tvaInput = document.getElementById('ndf-tva');
    const ttcInput = document.getElementById('ndf-ttc');

    function r(v) { return Math.round(v * 100) / 100; }

    function setCalc(input, value) {
      input.value = value >= 0 ? value : '';
      input.classList.toggle('input-success', value >= 0 && input.value !== '');
    }

    function clearCalc(input) {
      input.classList.remove('input-success');
    }

    function calculateAmounts() {
      const ttc = parseFloat(ttcInput.value);
      const tva = parseFloat(tvaInput.value);

      if (isNaN(ttc)) {
        htInput.value = '';
        return;
      }
      htInput.value = r(!isNaN(tva) ? ttc - tva : ttc);
      updatePreview();
    }

    ttcInput.addEventListener('input', calculateAmounts);
    tvaInput.addEventListener('input', calculateAmounts);

    // ── Upload ─────────────────────────────────────────────
    const fileInput  = document.getElementById('ndf-file');
    const uploadZone = document.getElementById('upload-zone');
    const preview    = document.getElementById('upload-preview');
    const filename   = document.getElementById('upload-filename');
    const clearBtn   = document.getElementById('upload-clear');

    const previewImg     = document.getElementById('preview-img');
    const previewPdf     = document.getElementById('preview-pdf');
    const previewPdfName = document.getElementById('preview-pdf-name');
    const previewZoomBtn = document.getElementById('preview-zoom-btn');

    function getFileKind(file) {
      const ext = file.name.split('.').pop().toLowerCase();
      if (ext === 'pdf' || file.type === 'application/pdf') return 'pdf';
      if (ext === 'heic' || ext === 'heif' || file.type === 'image/heic' || file.type === 'image/heif') return 'heic';
      if (file.type.startsWith('image/') || ['jpg','jpeg','png','gif','webp','bmp'].includes(ext)) return 'image';
      return 'other';
    }

    // ── Décodage HEIC — rendu natif (Safari / macOS Chrome) ─
    async function decodeHeic(file) {
      try {
        const bitmap = await createImageBitmap(file);
        const canvas = document.createElement('canvas');
        canvas.width  = bitmap.width;
        canvas.height = bitmap.height;
        canvas.getContext('2d').drawImage(bitmap, 0, 0);
        bitmap.close();
        return canvas.toDataURL('image/jpeg', 0.85);
      } catch { /* continue */ }

      const nativeUrl = URL.createObjectURL(file);
      const nativeOk  = await new Promise(resolve => {
        const t = new Image();
        t.onload  = () => resolve(true);
        t.onerror = () => resolve(false);
        t.src = nativeUrl;
      });
      if (nativeOk) return nativeUrl;
      URL.revokeObjectURL(nativeUrl);

      throw new Error('Conversion impossible');
    }

    const previewConverting = document.getElementById('preview-converting');
    const previewPdfEmbed   = document.getElementById('preview-pdf-embed');

    function clearPreviewMedia() {
      previewImg.classList.remove('show');
      previewImg.src = '';
      previewPdf.style.display          = 'none';
      previewPdfEmbed.style.display     = 'none';
      previewConverting.style.display   = 'none';
    }

    function showZoomBtn(visible) {
      previewZoomBtn.style.display = visible ? 'inline-flex' : 'none';
    }

    async function showFilePreview(file) {
      filename.textContent = file.name;
      preview.classList.add('show');
      uploadZone.style.display = 'none';

      clearPreviewMedia();
      showZoomBtn(false);
      updatePreview();

      const kind = getFileKind(file);

      if (kind === 'image') {
        previewImg.src = URL.createObjectURL(file);
        previewImg.classList.add('show');
        showZoomBtn(true);

      } else if (kind === 'heic') {
        previewConverting.style.display = 'flex';

        try {
          const jpegUrl = await decodeHeic(file);
          previewImg.src = jpegUrl;
          previewImg.classList.add('show');
          showZoomBtn(true);
        } catch {
          previewPdfName.textContent    = 'Aperçu non disponible — le fichier sera bien envoyé.';
          previewPdf.querySelector('i').className   = 'ti ti-photo';
          previewPdf.querySelector('i').style.color = 'var(--primary-blue)';
          previewPdf.style.display = 'flex';
        } finally {
          previewConverting.style.display = 'none';
        }

      } else if (kind === 'pdf') {
        const url = URL.createObjectURL(file);
        // Tente l'embed (desktop) ; sur mobile sans support natif on affiche le fallback
        previewPdfEmbed.src           = url;
        previewPdfEmbed.style.display = 'block';
        previewPdfEmbed.onerror = () => {
          previewPdfEmbed.style.display = 'none';
          previewPdfName.textContent    = file.name;
          previewPdf.style.display      = 'flex';
        };
      }
    }

    function resetUpload() {
      fileInput.value = '';
      preview.classList.remove('show');
      uploadZone.style.display = '';
      clearPreviewMedia();
      showZoomBtn(false);
      updatePreview();
    }

    // ── Lightbox ───────────────────────────────────────────
    const lightboxOverlay = document.getElementById('lightbox-overlay');
    const lightboxImg     = document.getElementById('lightbox-img');
    const lightboxClose   = document.getElementById('lightbox-close');

    function openLightbox() {
      lightboxImg.src = previewImg.src;
      lightboxOverlay.classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightboxOverlay.classList.remove('show');
      document.body.style.overflow = '';
    }

    previewImg.addEventListener('click', openLightbox);
    previewZoomBtn.addEventListener('click', openLightbox);
    lightboxClose.addEventListener('click', closeLightbox);
    lightboxOverlay.addEventListener('click', (e) => { if (e.target === lightboxOverlay) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

    function onFileSelected() {
      if (fileInput.files && fileInput.files.length) showFilePreview(fileInput.files[0]);
    }

    fileInput.addEventListener('change', onFileSelected);
    fileInput.addEventListener('input',  onFileSelected);

    clearBtn.addEventListener('click', resetUpload);

    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) {
        const dt = new DataTransfer();
        dt.items.add(file);
        fileInput.files = dt.files;
        showFilePreview(file);
      }
    });

    // ── Submit ─────────────────────────────────────────────
    const form      = document.getElementById('ndf-form');
    const alertEl   = document.getElementById('form-alert');
    const submitBtn = document.getElementById('submit-btn');

    const API_ENDPOINT = 'https://default7f445c4676a04cbb9bfbd227990a46.18.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/98b00d9c2ad14c2a927169e223c893a8/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hT1OJX2R7Do5o0v-GdVk2NxHxZX02fsVLTrNCT-7uiU';

    function showAlert(message, type) {
      alertEl.className = `alert alert-${type} mb-4`;
      alertEl.textContent = message;
      alertEl.style.display = 'block';
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.style.display = 'none';

      const file = fileInput.files[0];
      if (!file) { showAlert('Veuillez joindre un justificatif.', 'error'); return; }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Envoi en cours…';

      try {
        const base64 = await fileToBase64(file);

        const payload = {
          date:        document.getElementById('ndf-date').value,
          concernant:  document.getElementById('ndf-concernant').value,
          type:        'Note de Frais',
          montant_ht:  htInput.value,
          montant_tva: tvaInput.value,
          montant_ttc: ttcInput.value,
          filename:    file.name,
          file:        base64,
        };

        const res = await fetch(API_ENDPOINT, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(payload),
        });

        if (res.ok) {
          showAlert('Note de frais enregistrée avec succès.', 'success');
          form.reset();
          resetUpload();
          dateInput.value = new Date().toISOString().split('T')[0];
          updatePreview();
        } else {
          showAlert(`Erreur serveur (${res.status}). Veuillez réessayer.`, 'error');
        }
      } catch (err) {
        showAlert('Impossible de contacter le serveur. Vérifiez votre connexion.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="ti ti-device-floppy"></i> Enregistrer';
      }
    });
  </script>
</body>
</html>
